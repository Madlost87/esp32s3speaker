# Copy to secrets.yaml next to galileo-va.yaml and fill in locally.
# secrets.yaml is intentionally ignored by git.

wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# The upstream package currently leaves API encryption disabled by default.
# If we later enable encryption in the config, add:
# api_encryption_key: "PUT_YOUR_OWN_BASE64_KEY_HERE"

# Un segreto di sessione audio diretto per cassa (openssl rand -hex 8).
# `tools/fleet new <id>` aggiunge da solo galileo_audio_bridge_session_id_<id>.
galileo_audio_bridge_session_id: "REPLACE_WITH_16_HEX_CHARACTERS"         # Taverna
galileo_audio_bridge_session_id_sala: "REPLACE_WITH_16_HEX_CHARACTERS"
galileo_audio_bridge_session_id_garage: "REPLACE_WITH_16_HEX_CHARACTERS"
