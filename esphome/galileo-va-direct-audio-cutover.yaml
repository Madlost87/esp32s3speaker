# Satellite Taverna (area Taverna). Solo identita': il comportamento e' nella
# base comune, rete e gruppi in sites/casa.yaml. Vedi docs/fleet.md.
# Il nome ESPHome "galileo-va" e' storico: non rinominare senza un piano.
substitutions:
  name: galileo-va
  friendly_name: Satellite Taverna
  static_ip: 192.168.1.171
  voip_extension: "101"
  direct_audio_port: "19007"
  direct_audio_control_port: "19008"
  direct_audio_session_id: !secret galileo_audio_bridge_session_id

packages:
  site: !include sites/casa.yaml
  firmware: !include galileo-va-direct-audio-cutover-base.yaml

esphome:
  build_path: build/galileo-va-direct-audio-cutover
