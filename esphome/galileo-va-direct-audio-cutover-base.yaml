# =============================================================================
# Waveshare ESP32-S3-AUDIO-Board: VA + VoIP + MWW (no display)
# Profile: FULL / dual-mic AFE / LED and physical buttons
# Composition: Preset + component bindings + shared mono mixer/player; codec/AFE bindings below.
# Runtime facts: native media/VoIP/Wi-Fi/mute listeners; shared VA/MWW callbacks.
# YAML keeps user controls, board wiring and presentation hooks.
# Support: https://github.com/sponsors/n-IA-hane
# =============================================================================
#
# Base comune di tutte le casse. Qui restano identita', release, versioni dei
# componenti e pin; il resto e' diviso per funzione in packages/satellite/:
#   board.yaml         scheda ESP32-S3, PSRAM, I2C, espansore TCA9555
#   connectivity.yaml  rete, Wi-Fi a IP fisso, API Home Assistant, log
#   audio.yaml         codec, AFE (AEC + doppio microfono), speaker, mixer
#   wake_word.yaml     micro_wake_word e wake word attive al boot
#   voip.yaml          runtime controller e voip_stack
#   direct_voice.yaml  cattura voce diretta verso Galileo Core
#   controls.yaml      tasti fisici, mute speaker (= mute della card), modo AEC

# =============================================================================
# PROJECT SETUP
# =============================================================================

substitutions:
  # Fleet release: one number for the whole satellite fleet. Bump it only with
  # `tools/fleet.py release <version>` (see docs/fleet.md); every device built
  # from this base reports it to Home Assistant and to `fleet.py status`.
  firmware_release: "2026.11.9"
  runtime_controller_debug: "false"
  # Identity (name, friendly_name, static_ip, voip_extension, direct_audio_*
  # ports and session) comes from the device file; network values and groups
  # from sites/<site>.yaml. See docs/fleet.md. Only behaviour defaults live here.
  direct_dialogue_enabled: "false"

  ext_components_source: "github://n-IA-hane/esphome-intercom@6581cfea712d0e13bf88c5aff3fa97b9e27123ab"
  voip_stack_components_source: "github://n-IA-hane/esphome-voip-stack@c693b4e75008afb5d2f584a09035aee2743a2210"
  audio_stack_components_source: "github://n-IA-hane/esphome-audio-stack@0482d741a938378ef948e3b8f3dd31536f9f2cc9"
  runtime_controller_components_source: "github://n-IA-hane/esphome-runtime-controller@9ab1a0e8a9d03c1252995827543a5c6ec14ac72c"

  assets_base: "https://github.com/n-IA-hane/esphome-intercom/raw/6581cfea712d0e13bf88c5aff3fa97b9e27123ab/"

  # Microphone ID for package mute switch
  mic_id: mic_main
  afe_aec_restore_mode: RESTORE_DEFAULT_ON
  runtime_controller_led_preset: ws2812_ring

  # ---------------------------------------------------------------------------
  # Pinout: shared codec/control I2C bus
  # ---------------------------------------------------------------------------
  codec_i2c_sda_pin: GPIO11
  codec_i2c_scl_pin: GPIO10

  # ---------------------------------------------------------------------------
  # Pinout: shared ES7210/ES8311 TDM audio bus
  # ---------------------------------------------------------------------------
  i2s_mclk_pin: GPIO12
  i2s_bclk_pin: GPIO13
  i2s_lrclk_pin: GPIO14
  i2s_din_pin: GPIO15
  i2s_dout_pin: GPIO16

  # ---------------------------------------------------------------------------
  # Pinout: board controls and status ring
  # ---------------------------------------------------------------------------
  boot_button_pin: GPIO0
  status_led_pin: GPIO38

packages:
  full_voice_voip_runtime: !include components/galileo_direct_runtime/presets/full_voice_voip_runtime.yaml
  runtime_controller: !include components/galileo_direct_runtime/runtime_controller/full_controller.yaml
  voice_assistant_runtime_controls: !include components/galileo_direct_runtime/voice_assistant/runtime_controls.yaml
  call_settings: github://n-IA-hane/esphome-intercom/packages/voip/call_settings.yaml@6581cfea712d0e13bf88c5aff3fa97b9e27123ab
  ha_api: github://n-IA-hane/esphome-intercom/packages/runtime/ha_connectivity.yaml@6581cfea712d0e13bf88c5aff3fa97b9e27123ab
  ota_maintenance: !include components/galileo_direct_runtime/ota/full_audio_maintenance.yaml
  voip_transport: github://n-IA-hane/esphome-intercom/packages/voip/transport.yaml@6581cfea712d0e13bf88c5aff3fa97b9e27123ab
  s3_base: github://n-IA-hane/esphome-intercom/packages/platform/esp32s3_base.yaml@6581cfea712d0e13bf88c5aff3fa97b9e27123ab
  native_diagnostics: github://n-IA-hane/esphome-intercom/packages/diagnostics/native.yaml@6581cfea712d0e13bf88c5aff3fa97b9e27123ab
  status_led: github://n-IA-hane/esphome-intercom/packages/led/status_ws2812_ring.yaml@6581cfea712d0e13bf88c5aff3fa97b9e27123ab
  afe_entities: github://n-IA-hane/esphome-intercom/packages/esp_afe/dual_mic_entities.yaml@6581cfea712d0e13bf88c5aff3fa97b9e27123ab
  audio_stack_controls: github://n-IA-hane/esphome-intercom/packages/esp_audio_stack/controls.yaml@6581cfea712d0e13bf88c5aff3fa97b9e27123ab
  speaker_power: github://n-IA-hane/esphome-intercom/packages/esp_audio_stack/speaker_power_switch.yaml@6581cfea712d0e13bf88c5aff3fa97b9e27123ab
  speaker_mixer: github://n-IA-hane/esphome-intercom/packages/audio/shared_mono_mixer_48k.yaml@6581cfea712d0e13bf88c5aff3fa97b9e27123ab
  speaker_media_player: github://n-IA-hane/esphome-intercom/packages/media_player/runtime_controller_mono_media_player_48k.yaml@6581cfea712d0e13bf88c5aff3fa97b9e27123ab
  flac_codecs_psram: github://n-IA-hane/esphome-intercom/packages/audio/flac_codecs_psram.yaml@6581cfea712d0e13bf88c5aff3fa97b9e27123ab
  # Pacchetti locali per funzione: dopo quelli upstream, che estendono.
  board: !include packages/satellite/board.yaml
  connectivity: !include packages/satellite/connectivity.yaml
  audio: !include packages/satellite/audio.yaml
  wake_word: !include packages/satellite/wake_word.yaml
  voip: !include packages/satellite/voip.yaml
  direct_voice: !include packages/satellite/direct_voice.yaml
  controls: !include packages/satellite/controls.yaml

# =============================================================================
# IDENTITY
# =============================================================================

# Device identity exposed to ESPHome, HA and the shared VoIP phonebook.
esphome:
  min_version: 2026.9.0
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: galileo.speaker-satellite
    version: ${firmware_release}
  platformio_options:
    board_build.flash_mode: dio

# =============================================================================
# EXTERNAL COMPONENTS
# =============================================================================

# Project components for full VA/VoIP, runtime controller and ESP AFE.

external_components:
  - source:
      type: local
      path: components
    components: [galileo_audio_tap]
  - source: ${voip_stack_components_source}
    components: [voip_stack]
  - source: ${ext_components_source}
    components: [speaker, voice_assistant, ota]
  - source: ${runtime_controller_components_source}
    components: [runtime_controller]
  - source: ${audio_stack_components_source}
    components: [esp_audio_stack, esp_afe]

# Fleet release visible as a diagnostic entity in Home Assistant, so the
# Sistema dashboard can show which release each satellite runs.
text_sensor:
  - platform: template
    id: firmware_release_text
    name: Firmware Release
    icon: mdi:package-variant-closed
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return std::string("${firmware_release}");'
