# Satellite Garage Hybrid (area Garage). Solo identita': il comportamento e'
# nella base comune, rete e gruppi in sites/casa.yaml. Vedi docs/fleet.md.
# Indirizzo .133: riservare il MAC nel router (DHCP) per evitare conflitti.
substitutions:
  name: satellite-garage
  friendly_name: Satellite Garage Hybrid
  static_ip: 192.168.1.133
  voip_extension: "103"
  direct_audio_port: "19011"
  direct_audio_control_port: "19012"
  direct_audio_session_id: !secret galileo_audio_bridge_session_id_garage

packages:
  site: !include sites/casa.yaml
  firmware: !include galileo-va-direct-audio-cutover-base.yaml

esphome:
  build_path: build/satellite-garage
