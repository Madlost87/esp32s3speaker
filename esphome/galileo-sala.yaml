# Satellite Sala (area Salotto 1). Solo identita': il comportamento e' nella
# base comune, rete e gruppi in sites/casa.yaml. Vedi docs/fleet.md.
substitutions:
  name: galileo-sala
  friendly_name: Satellite Sala
  static_ip: 192.168.1.172
  voip_extension: "102"
  direct_audio_port: "19009"
  direct_audio_control_port: "19010"
  direct_audio_session_id: !secret galileo_audio_bridge_session_id_sala

packages:
  site: !include sites/casa.yaml
  firmware: !include galileo-va-direct-audio-cutover-base.yaml

esphome:
  build_path: build/galileo-sala
