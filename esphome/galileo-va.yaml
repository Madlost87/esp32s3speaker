# Galileo/Jarvis voice satellite thin config.
#
# This file intentionally keeps the board-specific implementation pinned to the
# tested upstream package. Local credentials live in secrets.yaml, which is
# ignored by git.

substitutions:
  name: galileo-va
  friendly_name: "Galileo Voice"

  # Europe/Rome POSIX timezone.
  posix_timezone: "CET-1CEST,M3.5.0,M10.5.0/3"

  # Conservative first-flash volume clamps. Raise only after speaker testing.
  volume_min: '0.25'
  volume_max: '0.90'

  # Keep first flash simple.
  hidden_ssid: 'false'
  enable_deep_sleep: 'false'

packages:
  core:
    url: https://github.com/MichalZaniewicz/esphome-waveshare-esp32-s3-audio-va
    ref: v1.1.1
    files:
      - base/core.yaml
    refresh: 1d

# Wi-Fi and local API settings come from secrets.yaml.

esphome:
  on_boot:
    - priority: -90
      then:
        - lambda: |-
            id(alexa).disable();
            id(okay_nabu).enable();
            id(hey_jarvis).enable();
            id(hey_mycroft).disable();
            ESP_LOGI("wake_word", "Forced active wake words: Okay Nabu + Hey Jarvis");
        - script.execute:
            id: apply_wake_word_sensitivity

# Assist STT audio tuning.
#
# The wake word stays on one channel, but Assist can stream two mono sources to
# Home Assistant. This lets HA compare both ES7210 mic channels for STT.
microphone:
  - id: !extend i2s_mics
    channel: stereo

micro_wake_word:
  id: mww
  microphone:
    microphone: i2s_mics
    channels: [0]

voice_assistant:
  id: va
  microphone:
    - microphone: i2s_mics
      channels: [0]
    - microphone: i2s_mics
      channels: [1]
  noise_suppression_level: 4
  auto_gain: 31dBFS
  volume_multiplier: 3
